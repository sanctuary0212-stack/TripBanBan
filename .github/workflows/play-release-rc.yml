name: Play Release Candidate

on:
  push:
    branches: [ release/play-rc ]
  workflow_dispatch:

jobs:
  build-play-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source hotfixes used by current production candidate
        run: |
          python3 tool/run38_hotfix.py
          python3 tool/run42_strings.py
          python3 tool/run42_patch.py
          python3 tool/run42_compilefix.py
          python3 tool/run47_about_english.py
          python3 tool/run50_compat.py
          python3 tool/run50_locale_drive.py
          python3 tool/run55_remove_drive.py

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT" >&2
            find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Play release candidate AAB
        run: bash tool/build_play_rc.sh

      - name: Upload Play RC AAB
        uses: actions/upload-artifact@v4
        with:
          name: TripBanBan-Play-RC-NOT-FOR-PRODUCTION
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
