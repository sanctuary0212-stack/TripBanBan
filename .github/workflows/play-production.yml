name: Play Production AAB

on:
  workflow_dispatch:

jobs:
  build-production:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply production candidate patches
        run: |
          python3 tool/run38_hotfix.py
          python3 tool/run42_strings.py
          python3 tool/run42_patch.py
          python3 tool/run42_compilefix.py
          python3 tool/run47_about_english.py
          python3 tool/run50_compat.py
          python3 tool/run50_locale_drive.py
          python3 tool/run55_remove_drive.py
          python3 tool/run60_play_billing.py
          python3 tool/run60_compilefix.py
          python3 tool/run61_privacy.py

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)"
          fi
          [ -x "$SDKMANAGER" ] || { echo "sdkmanager not found" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "ANDROID_KEYSTORE_BASE64 secret is missing" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tripbanban-upload.jks"
          chmod 600 "$RUNNER_TEMP/tripbanban-upload.jks"

      - name: Build production signed AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tripbanban-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash tool/build_play_production.sh

      - name: Upload production AAB
        uses: actions/upload-artifact@v4
        with:
          name: TripBanBan-Production-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
