name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter and Android diagnostics
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Project preflight
        run: python3 tool/preflight.py

      - name: Bootstrap Android and build debug APK
        run: bash tool/bootstrap_android.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TripBanBan-v0.8.2-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TripBanBan-v0.8.2-build-diagnostics
          path: |
            build/**/test-results/**
            build/**/reports/**
          if-no-files-found: ignore
          retention-days: 7
