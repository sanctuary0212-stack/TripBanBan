name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Run38 source hotfix
        run: python3 tool/run38_hotfix.py

      - name: Apply complete UI localization strings
        run: python3 tool/run42_strings.py

      - name: Apply complete UI localization patch
        run: python3 tool/run42_patch.py

      - name: Fix localization compile issues
        run: python3 tool/run42_compilefix.py

      - name: Keep About section in English
        run: python3 tool/run47_about_english.py

      - name: Fix core localization and Drive OAuth configuration
        run: python3 tool/run50_locale_drive.py

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter and Android diagnostics
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Project preflight
        run: python3 tool/preflight.py

      - name: Bootstrap Android and build debug APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: bash tool/bootstrap_android.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TripBanBan-v0.8.4-run50-localization-drive-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TripBanBan-v0.8.4-run50-diagnostics
          path: |
            build/**/test-results/**
            build/**/reports/**
          if-no-files-found: ignore
          retention-days: 7
