name: Restore TripBanBan v0.8.2

on:
  push:
    branches: [ main ]
    paths:
      - '.tripbanban_restore/runtime_06'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify v0.8.2 runtime source
        shell: bash
        run: |
          set -euo pipefail
          cat .tripbanban_restore/runtime_* > /tmp/tripbanban_v082.b64
          base64 -d /tmp/tripbanban_v082.b64 > /tmp/tripbanban_v082.tar.xz
          echo "a91ca4a94da2534867828502bc44186a01697d82e3721589b552d7c4f1cc7396  /tmp/tripbanban_v082.tar.xz" | sha256sum -c -
          mkdir -p /tmp/tripbanban_v082
          tar -xJf /tmp/tripbanban_v082.tar.xz -C /tmp/tripbanban_v082

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/tripbanban_v082/. .
          python3 tool/preflight.py

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore TripBanBan v0.8.2 Android runtime source"
          git push origin HEAD:main
